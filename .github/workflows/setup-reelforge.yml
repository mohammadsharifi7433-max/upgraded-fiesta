name: Setup ReelForge AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ReelForge files
        shell: bash
        run: |
          mkdir -p app/templates app/static

          cat > requirements.txt <<'EOF'
          Flask>=3.0,<4
          gunicorn>=22,<24
          python-dotenv>=1.0,<2
          EOF

          cat > app.py <<'EOF'
          import os
          from flask import Flask, render_template, jsonify

          app = Flask(__name__)

          @app.get("/")
          def home():
              return render_template("index.html")

          @app.get("/api/health")
          def health():
              return jsonify({
                  "status": "ok",
                  "service": "ReelForge AI"
              })

          @app.get("/api/info")
          def info():
              return jsonify({
                  "name": "ReelForge AI",
                  "version": "1.0.0",
                  "message": "Your content. Powered by AI."
              })

          if __name__ == "__main__":
              app.run(
                  host="0.0.0.0",
                  port=int(os.environ.get("PORT", 10000))
              )
          EOF

          cat > app/templates/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>ReelForge AI</title>
            <style>
              *{box-sizing:border-box}
              body{
                margin:0;
                font-family:Arial,sans-serif;
                background:#09090b;
                color:#fff;
              }
              .hero{
                max-width:1100px;
                margin:auto;
                padding:80px 24px;
                text-align:center;
              }
              .badge{
                display:inline-block;
                padding:8px 14px;
                border:1px solid #333;
                border-radius:30px;
                color:#aaa;
                margin-bottom:25px;
              }
              h1{
                font-size:clamp(45px,8vw,82px);
                margin:0;
                line-height:1;
              }
              .gradient{
                background:linear-gradient(90deg,#7c3aed,#ec4899,#f59e0b);
                -webkit-background-clip:text;
                color:transparent;
              }
              p{
                color:#aaa;
                font-size:20px;
                line-height:1.6;
              }
              .card{
                max-width:760px;
                margin:45px auto;
                padding:35px;
                background:#151518;
                border:1px solid #29292e;
                border-radius:24px;
              }
              input{
                width:100%;
                padding:18px;
                background:#0d0d0f;
                color:white;
                border:1px solid #333;
                border-radius:12px;
                margin:15px 0;
              }
              button{
                width:100%;
                padding:18px;
                border:0;
                border-radius:12px;
                background:#7c3aed;
                color:white;
                font-size:17px;
                font-weight:bold;
              }
              .features{
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
                gap:18px;
                margin-top:40px;
              }
              .feature{
                padding:25px;
                background:#111114;
                border:1px solid #29292e;
                border-radius:18px;
                text-align:left;
              }
              .feature h3{margin-top:0}
              footer{
                color:#666;
                padding:40px;
                text-align:center;
              }
            </style>
          </head>

          <body>
            <section class="hero">
              <div class="badge">AI Content Studio</div>

              <h1>
                Your content.<br>
                <span class="gradient">Powered by AI.</span>
              </h1>

              <p>
                Turn long videos into engaging short-form content,
                generate captions and create social-ready content faster.
              </p>

              <div class="card">
                <h2>AI Reel Maker</h2>
                <p>Upload your video and prepare it for short-form content.</p>

                <input type="file" accept="video/*">

                <button onclick="startDemo()">
                  Create My Reel
                </button>

                <p id="status"></p>
              </div>

              <div class="features">
                <div class="feature">
                  <h3>🎬 AI Reel Maker</h3>
                  <p>Prepare vertical short-form videos.</p>
                </div>

                <div class="feature">
                  <h3>✂️ One Click Content</h3>
                  <p>Create multiple short clips from long videos.</p>
                </div>

                <div class="feature">
                  <h3>✍️ AI Captions</h3>
                  <p>Generate hooks, captions and hashtags.</p>
                </div>

                <div class="feature">
                  <h3>📸 AI Photo Studio</h3>
                  <p>Prepare images for social media and products.</p>
                </div>
              </div>
            </section>

            <footer>
              ReelForge AI — Your content. Powered by AI.
            </footer>

            <script>
              async function startDemo(){
                const status=document.getElementById("status");
                status.textContent="Checking ReelForge AI...";

                try{
                  const r=await fetch("/api/health");
                  const data=await r.json();
                  status.textContent=
                    data.status==="ok"
                    ? "✓ ReelForge AI is online."
                    : "Something went wrong.";
                }catch(e){
                  status.textContent="Connection error.";
                }
              }
            </script>
          </body>
          </html>
          EOF

          cat > Dockerfile <<'EOF'
          FROM python:3.12-slim

          WORKDIR /app

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY . .

          ENV PYTHONUNBUFFERED=1

          CMD gunicorn --bind 0.0.0.0:${PORT:-10000} app:app
          EOF

          cat > render.yaml <<'EOF'
          services:
            - type: web
              name: reelforge-ai
              runtime: docker
              plan: free
              dockerfilePath: ./Dockerfile
              healthCheckPath: /api/health
          EOF

          cat > .gitignore <<'EOF'
          __pycache__/
          *.pyc
          .env
          .venv/
          node_modules/
          uploads/
          outputs/
          EOF

          git config user.name "ReelForge AI"
          git config user.email "reelforge-ai@users.noreply.github.com"

          git add .

          git commit -m "Setup ReelForge AI deployment"

          git push

      - name: Finished
        run: echo "ReelForge AI setup completed successfully."
